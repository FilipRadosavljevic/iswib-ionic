<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div id="wrapper">
    <form (ngSubmit)="register()" [formGroup]="credentialsForm">
      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-input
          type="text"
          placeholder="First Name"
          formControlName="firstName"
          errorText="First name is required"
        ></ion-input>
      </ion-item>
      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-input
          type="text"
          placeholder="Last Name"
          formControlName="lastName"
          errorText="Last name is required"
        ></ion-input>
      </ion-item>
      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-input
          type="text"
          placeholder="Email"
          formControlName="email"
          [errorText]="email.errors?.['required'] ? 'Email is required' : 'Email is invalid'"
        ></ion-input>
      </ion-item>
      <ion-item color="primary" class="ion-margin-horizontal ion-margin-vertical" lines="none">
        <ion-input
          type="password"
          placeholder="Password"
          formControlName="password"
          [errorText]="
            password.errors?.['required']
              ? 'Password is required'
              : 'Password needs to be at least 6 characters'
          "
        ></ion-input>
      </ion-item>
      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-input
          type="password"
          placeholder="Confirm Password"
          formControlName="confirmPassword"
        ></ion-input>
      </ion-item>
      @if (confirmPassword.dirty && credentialsForm.errors?.['missMatch']) {
        <ion-note
          color="danger"
          class="ion-margin-horizontal"
          >
          Passwords must match
        </ion-note>
      }

      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-select interface="action-sheet" placeholder="Select Role" formControlName="role">
          @for (role of roles; track role) {
            <ion-select-option [value]="role.value">{{
              role.label
            }}</ion-select-option>
          }
        </ion-select>
      </ion-item>

      <ion-button
        class="ion-margin-horizontal ion-margin-vertical"
        type="submit"
        color="secondary"
        expand="block"
        [disabled]="!credentialsForm.valid"
        >Sign Up
      </ion-button>
    </form>
    <img
      class="last-image"
      alt="logo"
      id="header_picture"
      src="assets/images/background/register.jpg"
      />
    </div>
  </ion-content>
