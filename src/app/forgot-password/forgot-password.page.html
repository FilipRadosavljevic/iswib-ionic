<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>Reset Your Password</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div id="wrapper">
    <form (ngSubmit)="resetPassword()" [formGroup]="credentials">
      <ion-item color="primary" class="ion-margin-horizontal" lines="none">
        <ion-input
          type="email"
          placeholder="Email"
          formControlName="email"
          errorText="Email is invalid"
        ></ion-input>
      </ion-item>
      <ion-button
        class="ion-margin-horizontal ion-margin-vertical"
        type="submit"
        color="secondary"
        expand="block"
        [disabled]="!credentials.valid"
        >Reset password</ion-button
      >
      <div class="ion-margin-horizontal ion-margin-vertical">
        <small>
          Please provide the username or email address that you used when you signed up for your
          ISWiB account.
        </small>
      </div>
    </form>
    <img alt="logo" id="header_picture" src="assets/images/background/reset-password.png" />
  </div>
</ion-content>
