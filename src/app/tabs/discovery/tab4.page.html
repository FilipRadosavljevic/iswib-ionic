<app-header />

<ion-content [fullscreen]="true" class="ion-padding-horizontal">
  @if (!data) {
    <div class="custom-skeleton">
      <h1>
        <ion-skeleton-text animated style="width: 60%; height: 25px" />
      </h1>
      <ion-grid>
        @for (item of [].constructor(5); track item) {
          <ion-row>
            <ion-col>
              <ion-card
                [style]="{
                  width: '100%',
                  height: '400px',
                  position: 'relative'
                }"
              >
                <ion-card-header>
                  <ion-thumbnail
                    [style]="{
                      width: '100%',
                      height: '400px'
                    }"
                  >
                    <ion-skeleton-text animated />
                  </ion-thumbnail>
                </ion-card-header>
                <ion-card-content>
                  <h1 class="ion-text-start">
                    <ion-skeleton-text animated style="width: 60%" />
                  </h1>
                  <ion-list class="bg-transparent flex">
                    <ion-skeleton-text animated style="width: 40%" />
                    <ion-skeleton-text class="circle" animated style="width: 15%" />
                  </ion-list>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
        }
      </ion-grid>
    </div>
  }
  @if (data) {
    <div>
      <h1>City discovery</h1>
      <ion-grid>
        @for (item of data; track item; let i = $index) {
          <ion-row>
            <ion-col>
              <ion-card
                [style]="{
                  background:
                    'linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .9)), url(' + item.image + ')',
                  'background-size': '100% 100%',
                  'background-repeat': 'no-repeat',
                  width: '100%',
                  height: '400px',
                  position: 'relative'
                }"
              >
                <ion-card-header>
                  <ion-list class="bg-transparent">
                    <!-- <ion-item color="none" lines="none">
                    <div class="stage" slot="end">
                      <div class="heart" [ngClass]="item.isLiked ? 'heart is-active' : 'heart'"
                        (click)="handleLike(item.id)">
                      </div>
                    </div>
                    <ion-label slot="end" class="likes">{{item.likes.length}}</ion-label>
                  </ion-item> -->
                  </ion-list>
                </ion-card-header>
                <ion-card-content>
                  <h1 class="ion-text-start">{{ item.name }}</h1>
                  <ion-list class="bg-transparent flex">
                    @if (item.location) {
                      <ion-chip (click)="goToLocation(data[i])" class="restaurant-chip">
                        <ion-icon color="primary" name="location-sharp" />
                        <ion-label color="primary">See location</ion-label>
                      </ion-chip>
                    }
                    <ion-chip class="arrow" (click)="goToPage(data[i])">
                      <ion-label color="primary">Read more</ion-label>
                      <ion-icon color="primary" name="chevron-forward-outline" />
                    </ion-chip>
                  </ion-list>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
        }
      </ion-grid>
    </div>
  }
</ion-content>
